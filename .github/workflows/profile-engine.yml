name: Profile Engine (Deterministic Generation)

on:
  schedule:
    - cron: "0 6,18 * * *" # Runs twice daily (6 AM & 6 PM UTC)
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/profile-revamp
    paths:
      - "now.yml"
      - "mcp.json"
      - "design/**"
      - "scripts/**"
      - ".github/workflows/profile-engine.yml"

concurrency:
  group: profile-engine
  cancel-in-progress: false

jobs:
  generate:
    name: Build & Validate Deterministic Assets
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Pinned Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml==6.0.2

      - name: Run Master Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/run_all.py

      - name: Build VectorForge Library Assets
        run: |
          python3 -m library.catalog

      - name: Run Snapshot & Schema Validation Tests
        run: |
          python3 -m unittest discover tests -v

      - name: Idempotent Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Only stage generated assets, caches, README, and library
          git add assets/ data/ README.md distribution/ library/
          
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "chore(profile): synchronize deterministic profile telemetry [skip ci]"
            git push
          fi
