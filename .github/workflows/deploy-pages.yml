name: Deploy VectorForge Showroom to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "library/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Gallery Distribution
        run: |
          mkdir -p _site
          cp -r library/gallery/* _site/
          mkdir -p _site/shapes
          cp -r library/shapes/* _site/shapes/
          cp library/catalog.json _site/

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
