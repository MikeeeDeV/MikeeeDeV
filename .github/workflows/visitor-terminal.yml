name: Workstation Visitor Terminal

on:
  issues:
    types: [opened]

concurrency:
  group: visitor-terminal
  cancel-in-progress: false

jobs:
  execute-command:
    name: Dispatch Whitelisted Terminal Command
    if: startsWith(github.event.issue.title, 'terminal:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pinned Dependencies
        run: |
          pip install pyyaml==6.0.2

      - name: Execute Terminal Action
        id: terminal
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          python3 scripts/visitor_terminal_action.py > receipt.txt
          cat receipt.txt

      - name: Commit Updated Ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/visitors.json assets/visitor-ledger.svg
          git commit -m "chore(terminal): log handshake from @${{ github.event.issue.user.login }} [skip ci]" || echo "No changes"
          git push

      - name: Reply and Close Issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --add-label "bot-processed"
          gh issue comment "$ISSUE_NUMBER" --body-file receipt.txt
          gh issue close "$ISSUE_NUMBER" --reason completed
