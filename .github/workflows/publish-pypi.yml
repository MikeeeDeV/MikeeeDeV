name: Publish VectorForge Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: 'Publish package to PyPI (requires PyPI Trusted Publisher or PYPI_API_TOKEN)'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    name: Build wheels and publish distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Tooling
        run: |
          python3 -m pip install --upgrade pip build twine

      - name: Build Distribution Packages
        run: |
          python3 -m build

      - name: Verify Distribution Archives
        run: |
          twine check dist/*

      - name: Upload Wheels to GitHub Release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} dist/* --clobber || true

      - name: Publish to PyPI
        if: ${{ secrets.PYPI_API_TOKEN != '' || inputs.publish_to_pypi == true }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}
        continue-on-error: true
