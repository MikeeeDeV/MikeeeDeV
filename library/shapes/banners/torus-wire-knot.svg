      <!-- Category & Status Badge -->
      <rect x="0" y="0" width="170" height="22" rx="4" class="badge-bg" />
      <circle cx="10" cy="11" r="3.5" fill="var(--vf-accent-1)" />
      <text x="22" y="15" class="tag-text">VECTORFORGE // BANNERS</text>
      
      <!-- Main Title -->
      <text x="0" y="56" class="title-text">TREFOIL TORUS KNOT</text>
      
      <!-- Subtitle & Specs -->
      <text x="0" y="82" class="subtitle-text">Deterministic 1-of-1 SVG Canvas • Seed 0xD982E7</text>
      <text x="0" y="104" font-family="var(--vf-font-mono)" font-size="11" fill="var(--vf-text-muted)">Theme: dracula • Resolution: 960x240 • Zero Runtime Dependency</text>
      
      <!-- Badges row -->
      <g transform="translate(0, 122)">
