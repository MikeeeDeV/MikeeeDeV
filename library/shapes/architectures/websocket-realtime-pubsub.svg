<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" width="820" height="280" role="img" aria-labelledby="title-id desc-id">
  <title id="title-id">WebSockets Realtime Engine - Topology Card</title>
  <desc id="desc-id">Architecture flow websocket-realtime-pubsub</desc>
  <style>
    :root {
      --vf-bg: #030A05;
      --vf-card: #07170B;
      --vf-border: #113B1B;
      --vf-text: #A3F7BF;
      --vf-text-muted: #4ADE80;
      --vf-accent-1: #00FF66;
      --vf-accent-2: #34D399;
      --vf-accent-3: #22C55E;
      --vf-glow: #00FF6644;
      --vf-font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --vf-font-mono: "JetBrains Mono", "Fira Code", ui-monospace, Menlo, Monaco, Consolas, monospace;
      --vf-font-arabic: "Cairo", "Amiri", "Tahoma", -apple-system, sans-serif;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --vf-bg: #F0FAF3;
        --vf-card: #FFFFFF;
        --vf-border: #B7E6C5;
        --vf-text: #063815;
        --vf-text-muted: #1A6832;
        --vf-accent-1: #048A36;
        --vf-accent-2: #0C6B45;
        --vf-accent-3: #15803D;
        --vf-glow: #048A3633;
      }
    }
    text {
      user-select: none;
    }
    
      .card-canvas { fill: var(--vf-card); stroke: var(--vf-border); stroke-width: 1; }
      .blueprint-grid { stroke: var(--vf-border); stroke-width: 0.5; opacity: 0.35; stroke-dasharray: 2 4; }
      .node-box { fill: var(--vf-bg); stroke: var(--vf-border); stroke-width: 1.5; }
      .node-title { font-family: var(--vf-font-mono); font-size: 11px; font-weight: 700; fill: var(--vf-text); }
      .node-sub { font-family: var(--vf-font-mono); font-size: 9.5px; fill: var(--vf-text-muted); }
      .bus-wire { stroke: var(--vf-accent-2); stroke-width: 1.8; fill: none; stroke-dasharray: 4 2; }
      .header-title { font-family: var(--vf-font-sans); font-size: 16px; font-weight: 800; fill: var(--vf-text); }
      .header-meta { font-family: var(--vf-font-mono); font-size: 11px; fill: var(--vf-text-muted); }
      .port-dot { fill: var(--vf-accent-1); }
    
  </style>
  
  <rect x="1" y="1" width="818" height="278" rx="8" class="card-canvas" />
<line x1="40" y1="0" x2="40" y2="280" class="blueprint-grid" />
<line x1="80" y1="0" x2="80" y2="280" class="blueprint-grid" />
<line x1="120" y1="0" x2="120" y2="280" class="blueprint-grid" />
<line x1="160" y1="0" x2="160" y2="280" class="blueprint-grid" />
<line x1="200" y1="0" x2="200" y2="280" class="blueprint-grid" />
<line x1="240" y1="0" x2="240" y2="280" class="blueprint-grid" />
<line x1="280" y1="0" x2="280" y2="280" class="blueprint-grid" />
<line x1="320" y1="0" x2="320" y2="280" class="blueprint-grid" />
<line x1="360" y1="0" x2="360" y2="280" class="blueprint-grid" />
<line x1="400" y1="0" x2="400" y2="280" class="blueprint-grid" />
<line x1="440" y1="0" x2="440" y2="280" class="blueprint-grid" />
<line x1="480" y1="0" x2="480" y2="280" class="blueprint-grid" />
<line x1="520" y1="0" x2="520" y2="280" class="blueprint-grid" />
<line x1="560" y1="0" x2="560" y2="280" class="blueprint-grid" />
<line x1="600" y1="0" x2="600" y2="280" class="blueprint-grid" />
<line x1="640" y1="0" x2="640" y2="280" class="blueprint-grid" />
<line x1="680" y1="0" x2="680" y2="280" class="blueprint-grid" />
<line x1="720" y1="0" x2="720" y2="280" class="blueprint-grid" />
<line x1="760" y1="0" x2="760" y2="280" class="blueprint-grid" />
<line x1="800" y1="0" x2="800" y2="280" class="blueprint-grid" />
<line x1="0" y1="40" x2="820" y2="40" class="blueprint-grid" />
<line x1="0" y1="80" x2="820" y2="80" class="blueprint-grid" />
<line x1="0" y1="120" x2="820" y2="120" class="blueprint-grid" />
<line x1="0" y1="160" x2="820" y2="160" class="blueprint-grid" />
<line x1="0" y1="200" x2="820" y2="200" class="blueprint-grid" />
<line x1="0" y1="240" x2="820" y2="240" class="blueprint-grid" />

    <g transform="translate(32, 28)">
      <rect x="0" y="-8" width="16" height="16" rx="3" fill="var(--vf-accent-1)" />
      <text x="26" y="6" class="header-title">WEBSOCKETS REALTIME ENGINE</text>
      <text x="26" y="24" class="header-meta">TOPOLOGY // LATENCY: &lt; 2.4ms • STATUS: DETERMINISTIC ONLINE</text>
    </g>
    
<g class="interconnects"><line x1="182.0" y1="146.0" x2="234.0" y2="146.0" class="bus-wire" /><circle cx="208.0" cy="146.0" r="3" fill="var(--vf-accent-1)" /><line x1="384.0" y1="146.0" x2="436.0" y2="146.0" class="bus-wire" /><circle cx="410.0" cy="146.0" r="3" fill="var(--vf-accent-1)" /><line x1="586.0" y1="146.0" x2="638.0" y2="146.0" class="bus-wire" /><circle cx="612.0" cy="146.0" r="3" fill="var(--vf-accent-1)" /></g>
<g class="nodes-layer">
        <g transform="translate(32.0, 110)">
          <rect x="0" y="0" width="150" height="72" rx="6" class="node-box" />
          <circle cx="12" cy="16" r="3" class="port-dot" />
          <text x="22" y="19" class="node-title">NODE_01</text>
          <text x="12" y="42" font-family="var(--vf-font-sans)" font-size="12px" font-weight="600" fill="var(--vf-text)">WSS Handshake</text>
          <text x="12" y="58" class="node-sub">gRPC / JSON-RPC</text>
          
          <!-- Port connectors -->
          <circle cx="0" cy="36.0" r="3" fill="var(--vf-accent-2)" />
          <circle cx="150" cy="36.0" r="3" fill="var(--vf-accent-2)" />
        </g>
        
        <g transform="translate(234.0, 110)">
          <rect x="0" y="0" width="150" height="72" rx="6" class="node-box" />
          <circle cx="12" cy="16" r="3" class="port-dot" />
          <text x="22" y="19" class="node-title">NODE_02</text>
          <text x="12" y="42" font-family="var(--vf-font-sans)" font-size="12px" font-weight="600" fill="var(--vf-text)">Socket Worker</text>
          <text x="12" y="58" class="node-sub">gRPC / JSON-RPC</text>
          
          <!-- Port connectors -->
          <circle cx="0" cy="36.0" r="3" fill="var(--vf-accent-2)" />
          <circle cx="150" cy="36.0" r="3" fill="var(--vf-accent-2)" />
        </g>
        
        <g transform="translate(436.0, 110)">
          <rect x="0" y="0" width="150" height="72" rx="6" class="node-box" />
          <circle cx="12" cy="16" r="3" class="port-dot" />
          <text x="22" y="19" class="node-title">NODE_03</text>
          <text x="12" y="42" font-family="var(--vf-font-sans)" font-size="12px" font-weight="600" fill="var(--vf-text)">Redis Pub/Sub</text>
          <text x="12" y="58" class="node-sub">gRPC / JSON-RPC</text>
          
          <!-- Port connectors -->
          <circle cx="0" cy="36.0" r="3" fill="var(--vf-accent-2)" />
          <circle cx="150" cy="36.0" r="3" fill="var(--vf-accent-2)" />
        </g>
        
        <g transform="translate(638.0, 110)">
          <rect x="0" y="0" width="150" height="72" rx="6" class="node-box" />
          <circle cx="12" cy="16" r="3" class="port-dot" />
          <text x="22" y="19" class="node-title">NODE_04</text>
          <text x="12" y="42" font-family="var(--vf-font-sans)" font-size="12px" font-weight="600" fill="var(--vf-text)">State Broadcast</text>
          <text x="12" y="58" class="node-sub">gRPC / JSON-RPC</text>
          
          <!-- Port connectors -->
          <circle cx="0" cy="36.0" r="3" fill="var(--vf-accent-2)" />
          <circle cx="150" cy="36.0" r="3" fill="var(--vf-accent-2)" />
        </g>
        </g>

    <g transform="translate(32, 230)">
      <rect x="0" y="0" width="756" height="28" rx="4" fill="var(--vf-bg)" stroke="var(--vf-border)" />
      <circle cx="16" cy="14" r="3.5" fill="var(--vf-accent-3)" />
      <text x="30" y="18" font-family="var(--vf-font-mono)" font-size="10.5" fill="var(--vf-text-muted)">ENVOY MESH // MTLS VERIFIED: YES • PACKET LOSS: 0.00% • ARCHITECTURE: RESILIENT</text>
    </g>
    
</svg>