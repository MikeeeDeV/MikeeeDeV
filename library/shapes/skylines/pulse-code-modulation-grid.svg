  <title id="title-id">PCM Digital Modulation - Contribution Skyline</title>
  <desc id="desc-id">Telemetry horizon pulse-code-modulation-grid</desc>
  <style>
    :root {
      --vf-bg: #221F22;
      --vf-card: #2D2A2E;
