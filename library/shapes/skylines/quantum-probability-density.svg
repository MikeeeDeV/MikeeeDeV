<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 210" width="880" height="210" role="img" aria-labelledby="title-id desc-id">
  <title id="title-id">Schrödinger Wave Packet - Contribution Skyline</title>
  <desc id="desc-id">Telemetry horizon quantum-probability-density</desc>
  <style>
    :root {
      --vf-bg: #16161E;
      --vf-card: #1F2335;
      --vf-border: #292E42;
      --vf-text: #C0CAF5;
      --vf-text-muted: #7AA2F7;
      --vf-accent-1: #7AA2F7;
      --vf-accent-2: #BB9AF7;
      --vf-accent-3: #73DACA;
      --vf-glow: #7AA2F744;
      --vf-font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --vf-font-mono: "JetBrains Mono", "Fira Code", ui-monospace, Menlo, Monaco, Consolas, monospace;
      --vf-font-arabic: "Cairo", "Amiri", "Tahoma", -apple-system, sans-serif;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --vf-bg: #F3F4F8;
        --vf-card: #FFFFFF;
        --vf-border: #D5D9E7;
        --vf-text: #1A1B26;
        --vf-text-muted: #4C5A85;
        --vf-accent-1: #3454B4;
        --vf-accent-2: #7245B8;
        --vf-accent-3: #1B8070;
        --vf-glow: #3454B433;
      }
    }
    text {
      user-select: none;
    }
    
      .card-frame { fill: var(--vf-card); stroke: var(--vf-border); stroke-width: 1; }
      .skyline-bar { fill: var(--vf-accent-1); }
      .skyline-sub { fill: var(--vf-accent-2); opacity: 0.65; }
      .grid-h { stroke: var(--vf-border); stroke-width: 0.5; stroke-dasharray: 2 4; }
      .metric-title { font-family: var(--vf-font-mono); font-size: 13px; font-weight: 700; fill: var(--vf-text); }
      .metric-stat { font-family: var(--vf-font-mono); font-size: 11px; fill: var(--vf-text-muted); }
      .accent-pill { fill: var(--vf-bg); stroke: var(--vf-border); stroke-width: 1; }
    
  </style>
  
  <rect x="1" y="1" width="878" height="208" rx="8" class="card-frame" />

    <g transform="translate(28, 26)">
      <circle cx="0" cy="0" r="4" fill="var(--vf-accent-1)" />
      <text x="12" y="4" class="metric-title">SCHRÖDINGER WAVE PACKET</text>
      <text x="12" y="20" class="metric-stat">52 WEEKS • 1,844 TOTAL COMMITS • 99.8% CI PASS RATE</text>
      
      <g transform="translate(640, -8)">
        <rect x="0" y="0" width="180" height="26" rx="4" class="accent-pill" />
        <circle cx="12" cy="13" r="3" fill="var(--vf-accent-3)" />
        <text x="24" y="17" font-family="var(--vf-font-mono)" font-size="10" font-weight="700" fill="var(--vf-accent-1)">PEAK: 34 COMMITS/DAY</text>
      </g>
    </g>
    
