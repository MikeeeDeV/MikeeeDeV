<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 240" width="100%" height="240" role="img" aria-label="Mohamed Ayman Generative Geometric Banner">
  <title>Mohamed Ayman (@MikeeeDeV) - Systems Engineer Banner</title>
  <desc>Generative Egyptian geometric rosette and circuit matrix seeded by git commit hash 0x8ba87448.</desc>
  <style>
    
    :root {
      --bg: #0A0E14;
      --card-bg: #111822;
      --card-elevated: #182230;
      --border: #223348;
      --border-accent: #3B5372;
      --text-primary: #E2E8F0;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --accent-gold: #E5C07B;
      --accent-lapis: #3898EC;
      --accent-teal: #2DD4BF;
      --accent-coral: #F43F5E;
      --term-green: #2DD4BF;
      --term-yellow: #E5C07B;
      --term-blue: #3898EC;
      --term-purple: #C678DD;
      --font-mono: ui-monospace, 'JetBrains Mono', 'SF Mono', 'Fira Code', 'Menlo', monospace;
      --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Cairo', sans-serif;
      --font-arabic: 'Cairo', 'Amiri', 'Noto Sans Arabic', 'Segoe UI', system-ui, sans-serif;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #F8FAFC;
        --card-bg: #FFFFFF;
        --card-elevated: #F1F5F9;
        --border: #CBD5E1;
        --border-accent: #94A3B8;
        --text-primary: #0F172A;
        --text-secondary: #475569;
        --text-muted: #64748B;
        --accent-gold: #B48924;
        --accent-lapis: #1E6BB8;
        --accent-teal: #0D9488;
        --accent-coral: #E11D48;
        --term-green: #0D9488;
        --term-yellow: #B48924;
        --term-blue: #1E6BB8;
        --term-purple: #9333EA;
      }
    }
    
    .banner-frame {
      fill: var(--card-bg);
      stroke: var(--border);
      stroke-width: 1px;
    }
    .inner-panel {
      fill: var(--card-elevated);
      stroke: var(--border-accent);
      stroke-width: 1px;
    }
    .kemet-name {
      font-family: var(--font-mono);
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 4px;
      fill: var(--text-primary);
    }
    .kemet-role {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.5px;
      fill: var(--accent-gold);
    }
    .kemet-tagline {
      font-family: var(--font-sans);
      font-size: 13.5px;
      fill: var(--text-secondary);
    }
    .seed-tag {
      font-family: var(--font-mono);
      font-size: 10.5px;
      fill: var(--accent-teal);
      letter-spacing: 1px;
    }
    .arabic-watermark {
      font-family: var(--font-arabic);
      font-size: 22px;
      font-weight: 700;
      fill: var(--border-accent);
      opacity: 0.22;
    }
    .badge-pill {
      fill: var(--card-elevated);
      stroke: var(--border-accent);
      stroke-width: 1px;
    }
    .badge-text {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      fill: var(--accent-lapis);
    }
    .glow-pulse {
      animation: banner-pulse 3s infinite ease-in-out;
    }
    @keyframes banner-pulse {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 0.45; }
    }
  </style>

  <rect x="0.5" y="0.5" width="979" height="239" rx="8" class="banner-frame" />

  <!-- Arabic Watermark (Clean subtle placement) -->
  <text x="620" y="48" class="arabic-watermark" text-anchor="end" direction="rtl" xml:lang="ar">محمد أيمن • مهندس نظم وبرمجيات</text>

  <!-- Nile Circuit Traces -->
  <g>
    <path d="M 620.0 165.0 L 439.0 145.3 L 329.6 155.9 L 198.5 165.3" fill="none" stroke="var(--accent-teal)" stroke-width="1" opacity="0.32" stroke-dasharray="4,4" /><circle cx="198.5" cy="165.3" r="2.5" fill="var(--accent-teal)" opacity="0.75" /><path d="M 620.0 181.0 L 483.2 169.6 L 382.1 160.9 L 287.9 149.7" fill="none" stroke="var(--accent-lapis)" stroke-width="1" opacity="0.32" stroke-dasharray="4,4" /><circle cx="287.9" cy="149.7" r="2.5" fill="var(--accent-lapis)" opacity="0.75" /><path d="M 620.0 170.0 L 488.7 183.8 L 387.5 202.6 L 247.7 205.0" fill="none" stroke="var(--accent-teal)" stroke-width="1" opacity="0.32" stroke-dasharray="4,4" /><circle cx="247.7" cy="205.0" r="2.5" fill="var(--accent-teal)" opacity="0.75" /><path d="M 620.0 185.0 L 511.7 174.4 L 400.2 153.2 L 232.6 141.6" fill="none" stroke="var(--accent-teal)" stroke-width="1" opacity="0.32" stroke-dasharray="4,4" /><circle cx="232.6" cy="141.6" r="2.5" fill="var(--accent-teal)" opacity="0.75" /><path d="M 620.0 165.0 L 458.6 142.8 L 318.8 158.8 L 189.4 162.7" fill="none" stroke="var(--accent-lapis)" stroke-width="1" opacity="0.32" stroke-dasharray="4,4" /><circle cx="189.4" cy="162.7" r="2.5" fill="var(--accent-lapis)" opacity="0.75" />
  </g>

  <!-- Left Content Branding -->
  <g transform="translate(42, 54)">
    <!-- Header Seed Indicator -->
    <g transform="translate(0, 0)">
      <rect x="0" y="-12" width="240" height="22" rx="4" class="inner-panel" />
      <circle cx="10" cy="-1" r="3.5" fill="var(--accent-teal)" class="glow-pulse" />
      <text x="22" y="3" class="seed-tag">CIPHER SEED: 0x8ba87448 // DETERMINISTIC</text>
    </g>

    <!-- Name -->
    <text x="0" y="46" class="kemet-name">MOHAMED AYMAN</text>
    
    <!-- Title -->
    <text x="0" y="74" class="kemet-role">SENIOR SYSTEMS &amp; FULL-STACK ARCHITECT</text>
    
    <!-- Engineering Focus Statement -->
    <text x="0" y="100" class="kemet-tagline">Architecting Zero-Drift Linux Tooling, Next.js Security Guards &amp; FastMCP AI Agents</text>

    <!-- Stack Badges -->
    <g transform="translate(0, 120)">
      <rect x="0" y="0" width="84" height="22" rx="3" class="badge-pill" />
      <text x="42" y="15" text-anchor="middle" class="badge-text">❄️ NIXOS</text>

      <rect x="94" y="0" width="98" height="22" rx="3" class="badge-pill" />
      <text x="143" y="15" text-anchor="middle" class="badge-text">⚡ FASTMCP</text>

      <rect x="202" y="0" width="102" height="22" rx="3" class="badge-pill" />
      <text x="253" y="15" text-anchor="middle" class="badge-text">🐍 PYTHON</text>

      <rect x="314" y="0" width="112" height="22" rx="3" class="badge-pill" />
      <text x="370" y="15" text-anchor="middle" class="badge-text">🛡️ NEXT.JS AUTH</text>
    </g>
  </g>

  <!-- Right Geometric 8-Point Rosette -->
  <g id="rosette">
    <circle cx="810" cy="120.0" r="102.5" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,4" opacity="0.6" /><circle cx="810" cy="120.0" r="82.0" fill="none" stroke="var(--accent-teal)" stroke-width="1.2" opacity="0.4" /><circle cx="810" cy="120.0" r="36.9" fill="none" stroke="var(--accent-gold)" stroke-width="1.2" opacity="0.8" /><polygon points="846.1,182.5 747.5,156.1 773.9,57.5 872.5,83.9" fill="none" stroke="var(--accent-gold)" stroke-width="1.5" opacity="0.9" /><polygon points="791.3,189.7 740.3,101.3 828.7,50.3 879.7,138.7" fill="none" stroke="var(--accent-lapis)" stroke-width="1.2" opacity="0.8" /><rect x="852.4" y="196.0" width="7" height="7" transform="rotate(45 855.9 199.5)" fill="var(--accent-gold)" /><line x1="810" y1="120.0" x2="855.9" y2="199.5" stroke="var(--border-accent)" stroke-width="0.8" opacity="0.6" /><rect x="782.7" y="205.2" width="7" height="7" transform="rotate(45 786.2 208.7)" fill="var(--accent-gold)" /><line x1="810" y1="120.0" x2="786.2" y2="208.7" stroke="var(--border-accent)" stroke-width="0.8" opacity="0.6" /><rect x="727.0" y="162.4" width="7" height="7" transform="rotate(45 730.5 165.9)" fill="var(--accent-gold)" /><line x1="810" y1="120.0" x2="730.5" y2="165.9" stroke="var(--border-accent)" stroke-width="0.8" opacity="0.6" /><rect x="717.8" y="92.7" width="7" height="7" transform="rotate(45 721.3 96.2)" fill="var(--accent-gold)" /><line x1="810" y1="120.0" x2="721.3" y2="96.2" stroke="var(--border-accent)" stroke-width="0.8" opacity="0.6" /><rect x="760.6" y="37.0" width="7" height="7" transform="rotate(45 764.1 40.5)" fill="var(--accent-gold)" /><line x1="810" y1="120.0" x2="764.1" y2="40.5" stroke="var(--border-accent)" stroke-width="0.8" opacity="0.6" /><rect x="830.3" y="27.8" width="7" height="7" transform="rotate(45 833.8 31.3)" fill="var(--accent-gold)" /><line x1="810" y1="120.0" x2="833.8" y2="31.3" stroke="var(--border-accent)" stroke-width="0.8" opacity="0.6" /><rect x="886.0" y="70.6" width="7" height="7" transform="rotate(45 889.5 74.1)" fill="var(--accent-gold)" /><line x1="810" y1="120.0" x2="889.5" y2="74.1" stroke="var(--border-accent)" stroke-width="0.8" opacity="0.6" /><rect x="895.2" y="140.3" width="7" height="7" transform="rotate(45 898.7 143.8)" fill="var(--accent-gold)" /><line x1="810" y1="120.0" x2="898.7" y2="143.8" stroke="var(--border-accent)" stroke-width="0.8" opacity="0.6" /><circle cx="810" cy="120.0" r="4.5" fill="var(--accent-gold)" />
  </g>

  <!-- Architectural Corner Brackets (Egyptian Masonry Chamfers) -->
  <g stroke="var(--accent-gold)" stroke-width="1.5" fill="none">
    <path d="M 12 24 L 12 12 L 24 12" />
    <path d="M 956 12 L 968 12 L 968 24" />
    <path d="M 12 216 L 12 228 L 24 228" />
    <path d="M 956 228 L 968 228 L 968 216" />
  </g>
</svg>