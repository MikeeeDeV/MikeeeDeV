<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 240" width="100%" height="240" role="img" aria-label="Mohamed Ayman Generative Geometric Banner">
  <title>Mohamed Ayman (@MikeeeDeV) - Systems Engineer Banner</title>
  <desc>Generative Egyptian geometric rosette and circuit matrix seeded by git commit hash 0x6537fc75.</desc>
  <style>
    
    :root {
      --bg: #0A0E14;
      --card-bg: #111822;
      --card-elevated: #182230;
      --border: #223348;
      --border-accent: #3B5372;
      --text-primary: #E2E8F0;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --accent-gold: #E5C07B;
      --accent-lapis: #3898EC;
      --accent-teal: #2DD4BF;
      --accent-coral: #F43F5E;
      --term-green: #2DD4BF;
      --term-yellow: #E5C07B;
      --term-blue: #3898EC;
      --term-purple: #C678DD;
      --font-mono: ui-monospace, 'JetBrains Mono', 'SF Mono', 'Fira Code', 'Menlo', monospace;
      --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Cairo', sans-serif;
      --font-arabic: 'Cairo', 'Amiri', 'Noto Sans Arabic', 'Segoe UI', system-ui, sans-serif;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #F8FAFC;
        --card-bg: #FFFFFF;
        --card-elevated: #F1F5F9;
        --border: #CBD5E1;
        --border-accent: #94A3B8;
        --text-primary: #0F172A;
        --text-secondary: #475569;
        --text-muted: #64748B;
        --accent-gold: #B48924;
        --accent-lapis: #1E6BB8;
        --accent-teal: #0D9488;
        --accent-coral: #E11D48;
        --term-green: #0D9488;
        --term-yellow: #B48924;
        --term-blue: #1E6BB8;
        --term-purple: #9333EA;
      }
    }
    
    .banner-frame {
      fill: var(--card-bg);
      stroke: var(--border);
      stroke-width: 1px;
    }
    .inner-panel {
      fill: var(--card-elevated);
      stroke: var(--border-accent);
      stroke-width: 1px;
    }
    .kemet-name {
      font-family: var(--font-mono);
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 4px;
      fill: var(--text-primary);
    }
    .kemet-role {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.5px;
      fill: var(--accent-gold);
    }
    .kemet-tagline {
      font-family: var(--font-sans);
      font-size: 13.5px;
      fill: var(--text-secondary);
    }
    .seed-tag {
      font-family: var(--font-mono);
      font-size: 10.5px;
      fill: var(--accent-teal);
      letter-spacing: 1px;
    }
    .arabic-watermark {
      font-family: var(--font-arabic);
      font-size: 22px;
      font-weight: 700;
      fill: var(--border-accent);
      opacity: 0.22;
    }
    .badge-pill {
      fill: var(--card-elevated);
      stroke: var(--border-accent);
      stroke-width: 1px;
    }
    .badge-text {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      fill: var(--accent-lapis);
    }
    .glow-pulse {
      animation: banner-pulse 3s infinite ease-in-out;
    }
    @keyframes banner-pulse {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 0.45; }
    }
  </style>

  <rect x="0.5" y="0.5" width="979" height="239" rx="8" class="banner-frame" />

  <!-- Arabic Watermark (Clean subtle placement) -->
  <text x="620" y="48" class="arabic-watermark" text-anchor="end" direction="rtl" xml:lang="ar">محمد أيمن • مهندس نظم وبرمجيات</text>

