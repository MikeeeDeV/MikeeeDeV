    <path d="M 620.0 95.0 L 434.9 112.5 L 249.7 108.9 L 138.7 88.5" fill="none" stroke="var(--accent-teal)" stroke-width="1" opacity="0.32" stroke-dasharray="4,4" /><circle cx="138.7" cy="88.5" r="2.5" fill="var(--accent-teal)" opacity="0.75" /><path d="M 620.0 50.0 L 466.6 53.0 L 379.5 66.0 L 288.0 64.0" fill="none" stroke="var(--accent-lapis)" stroke-width="1" opacity="0.32" stroke-dasharray="4,4" /><circle cx="288.0" cy="64.0" r="2.5" fill="var(--accent-lapis)" opacity="0.75" /><path d="M 620.0 132.0 L 447.9 129.4 L 340.2 149.2 L 245.7 140.2" fill="none" stroke="var(--accent-lapis)" stroke-width="1" opacity="0.32" stroke-dasharray="4,4" /><circle cx="245.7" cy="140.2" r="2.5" fill="var(--accent-lapis)" opacity="0.75" /><path d="M 620.0 127.0 L 446.4 114.2 L 351.9 117.2 L 190.4 131.8" fill="none" stroke="var(--accent-teal)" stroke-width="1" opacity="0.32" stroke-dasharray="4,4" /><circle cx="190.4" cy="131.8" r="2.5" fill="var(--accent-teal)" opacity="0.75" /><path d="M 620.0 85.0 L 478.6 94.9 L 380.6 78.7 L 252.7 80.3" fill="none" stroke="var(--accent-lapis)" stroke-width="1" opacity="0.32" stroke-dasharray="4,4" /><circle cx="252.7" cy="80.3" r="2.5" fill="var(--accent-lapis)" opacity="0.75" />
  </g>

  <!-- Left Content Branding -->
  <g transform="translate(42, 54)">
    <!-- Header Seed Indicator -->
    <g transform="translate(0, 0)">
      <rect x="0" y="-12" width="240" height="22" rx="4" class="inner-panel" />
      <circle cx="10" cy="-1" r="3.5" fill="var(--accent-teal)" class="glow-pulse" />
      <text x="22" y="3" class="seed-tag">CIPHER SEED: 0x6537fc75 // DETERMINISTIC</text>
    </g>

    <!-- Name -->
    <text x="0" y="46" class="kemet-name">MOHAMED AYMAN</text>
    
    <!-- Title -->
    <text x="0" y="74" class="kemet-role">TECHNICAL TEAM LEADER @ GAWDAH • SYSTEMS &amp; FULL-STACK</text>
    
    <!-- Engineering Focus Statement -->
    <text x="0" y="100" class="kemet-tagline">Architecting Zero-Drift Linux Tooling, Next.js Security Guards &amp; FastMCP AI Agents</text>

    <!-- Stack Badges -->
    <g transform="translate(0, 120)">
      <rect x="0" y="0" width="84" height="22" rx="3" class="badge-pill" />
      <text x="42" y="15" text-anchor="middle" class="badge-text">❄️ NIXOS</text>

      <rect x="94" y="0" width="98" height="22" rx="3" class="badge-pill" />
      <text x="143" y="15" text-anchor="middle" class="badge-text">⚡ FASTMCP</text>

      <rect x="202" y="0" width="102" height="22" rx="3" class="badge-pill" />
      <text x="253" y="15" text-anchor="middle" class="badge-text">🐍 PYTHON</text>

      <rect x="314" y="0" width="112" height="22" rx="3" class="badge-pill" />
      <text x="370" y="15" text-anchor="middle" class="badge-text">🛡️ NEXT.JS AUTH</text>
    </g>
  </g>

  <!-- Right Geometric 8-Point Rosette -->
  <g id="rosette">
    <circle cx="810" cy="120.0" r="102.5" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,4" opacity="0.6" /><circle cx="810" cy="120.0" r="82.0" fill="none" stroke="var(--accent-teal)" stroke-width="1.2" opacity="0.4" /><circle cx="810" cy="120.0" r="36.9" fill="none" stroke="var(--accent-gold)" stroke-width="1.2" opacity="0.8" /><polygon points="880.8,134.1 795.9,190.8 739.2,105.9 824.1,49.2" fill="none" stroke="var(--accent-gold)" stroke-width="1.5" opacity="0.9" /><polygon points="850.1,180.0 750.0,160.1 769.9,60.0 870.0,79.9" fill="none" stroke="var(--accent-lapis)" stroke-width="1.2" opacity="0.8" /><rect x="896.6" y="134.4" width="7" height="7" transform="rotate(45 900.1 137.9)" fill="var(--accent-gold)" /><line x1="810" y1="120.0" x2="900.1" y2="137.9" stroke="var(--border-accent)" stroke-width="0.8" opacity="0.6" /><rect x="857.5" y="192.9" width="7" height="7" transform="rotate(45 861.0 196.4)" fill="var(--accent-gold)" /><line x1="810" y1="120.0" x2="861.0" y2="196.4" stroke="var(--border-accent)" stroke-width="0.8" opacity="0.6" /><rect x="788.6" y="206.6" width="7" height="7" transform="rotate(45 792.1 210.1)" fill="var(--accent-gold)" /><line x1="810" y1="120.0" x2="792.1" y2="210.1" stroke="var(--border-accent)" stroke-width="0.8" opacity="0.6" /><rect x="730.1" y="167.5" width="7" height="7" transform="rotate(45 733.6 171.0)" fill="var(--accent-gold)" /><line x1="810" y1="120.0" x2="733.6" y2="171.0" stroke="var(--border-accent)" stroke-width="0.8" opacity="0.6" /><rect x="716.4" y="98.6" width="7" height="7" transform="rotate(45 719.9 102.1)" fill="var(--accent-gold)" /><line x1="810" y1="120.0" x2="719.9" y2="102.1" stroke="var(--border-accent)" stroke-width="0.8" opacity="0.6" /><rect x="755.5" y="40.1" width="7" height="7" transform="rotate(45 759.0 43.6)" fill="var(--accent-gold)" /><line x1="810" y1="120.0" x2="759.0" y2="43.6" stroke="var(--border-accent)" stroke-width="0.8" opacity="0.6" /><rect x="824.4" y="26.4" width="7" height="7" transform="rotate(45 827.9 29.9)" fill="var(--accent-gold)" /><line x1="810" y1="120.0" x2="827.9" y2="29.9" stroke="var(--border-accent)" stroke-width="0.8" opacity="0.6" /><rect x="882.9" y="65.5" width="7" height="7" transform="rotate(45 886.4 69.0)" fill="var(--accent-gold)" /><line x1="810" y1="120.0" x2="886.4" y2="69.0" stroke="var(--border-accent)" stroke-width="0.8" opacity="0.6" /><circle cx="810" cy="120.0" r="4.5" fill="var(--accent-gold)" />
  </g>

  <!-- Architectural Corner Brackets (Egyptian Masonry Chamfers) -->
  <g stroke="var(--accent-gold)" stroke-width="1.5" fill="none">
    <path d="M 12 24 L 12 12 L 24 12" />
    <path d="M 956 12 L 968 12 L 968 24" />
    <path d="M 12 216 L 12 228 L 24 228" />
    <path d="M 956 228 L 968 228 L 968 216" />
  </g>
</svg>