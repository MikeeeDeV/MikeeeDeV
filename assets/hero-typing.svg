<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 138" width="860" height="138" role="img" aria-label="Mohamed Ayman Positioning Statement">
  <title>Mohamed Ayman (MikeeeDeV) - Systems &amp; Full-Stack Engineer</title>
  <desc>Architecting deterministic Linux systems, resilient auth guards and FastMCP agent infrastructure. Egyptian systems engineer.</desc>
  <style>
    
    :root {
      --bg: #0A0E14;
      --card-bg: #111822;
      --card-elevated: #182230;
      --border: #223348;
      --border-accent: #3B5372;
      --text-primary: #E2E8F0;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --accent-gold: #E5C07B;
      --accent-lapis: #3898EC;
      --accent-teal: #2DD4BF;
      --accent-coral: #F43F5E;
      --term-green: #2DD4BF;
      --term-yellow: #E5C07B;
      --term-blue: #3898EC;
      --term-purple: #C678DD;
      --font-mono: ui-monospace, 'JetBrains Mono', 'SF Mono', 'Fira Code', 'Menlo', monospace;
      --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Cairo', sans-serif;
      --font-arabic: 'Cairo', 'Amiri', 'Noto Sans Arabic', 'Segoe UI', system-ui, sans-serif;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #F8FAFC;
        --card-bg: #FFFFFF;
        --card-elevated: #F1F5F9;
        --border: #CBD5E1;
        --border-accent: #94A3B8;
        --text-primary: #0F172A;
        --text-secondary: #475569;
        --text-muted: #64748B;
        --accent-gold: #B48924;
        --accent-lapis: #1E6BB8;
        --accent-teal: #0D9488;
        --accent-coral: #E11D48;
        --term-green: #0D9488;
        --term-yellow: #B48924;
        --term-blue: #1E6BB8;
        --term-purple: #9333EA;
      }
    }
    
    .hero-card {
      fill: var(--card-bg);
      stroke: var(--border);
      stroke-width: 1px;
    }
    .terminal-prompt {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      fill: var(--accent-teal);
    }
    .terminal-cmd {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 500;
      fill: var(--text-primary);
    }
    .typewriter-eng {
      font-family: var(--font-mono);
      font-size: 13.5px;
      font-weight: 500;
      fill: var(--accent-gold);
    }
    .arabic-text {
      font-family: var(--font-arabic);
      font-size: 13.5px;
      font-weight: 600;
      fill: var(--text-secondary);
    }
    .cursor {
      fill: var(--accent-gold);
      font-weight: 700;
      animation: blink 0.9s infinite step-start;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <rect x="0.5" y="0.5" width="859" height="137" rx="8" class="hero-card" />

  <!-- Window Header Bar Line -->
  <line x1="0" y1="32" x2="860" y2="32" stroke="var(--border)" stroke-width="1" />
  
  <g transform="translate(18, 20)">
    <circle cx="0" cy="0" r="4" fill="var(--accent-coral)" />
    <circle cx="14" cy="0" r="4" fill="var(--accent-gold)" />
    <circle cx="28" cy="0" r="4" fill="var(--accent-teal)" />
    
    <text x="50" y="4" font-family="var(--font-mono)" font-size="11" fill="var(--text-muted)">session: init --profile=engineer --location=cairo</text>
    <text x="812" y="4" font-family="var(--font-mono)" font-size="11" font-weight="600" fill="var(--accent-teal)" text-anchor="end">STATUS: ACTIVE</text>
  </g>

  <!-- Line 1: Terminal Command -->
  <g transform="translate(24, 60)">
    <text x="0" y="0" class="terminal-prompt">mikeee@workstation<tspan fill="var(--text-muted)">:~$</tspan></text>
    <text x="175" y="0" class="terminal-cmd">antigravity --focus=systems --manifest</text>
  </g>

  <!-- Line 2: Positioning Statement with Inline Natural Blinking Cursor -->
  <g transform="translate(24, 88)">
    <text x="0" y="0" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="var(--accent-teal)">❯</text>
    <text x="18" y="0" class="typewriter-eng">Architecting deterministic Linux systems, resilient auth guards &amp; FastMCP agent infrastructure.<tspan class="cursor" dx="4">▋</tspan></text>
  </g>

  <!-- Line 3: Arabic Typographic Line (Cleanly bounded to avoid clipping) -->
  <g transform="translate(24, 116)">
    <text x="0" y="0" font-family="var(--font-mono)" font-size="11" font-weight="600" fill="var(--accent-lapis)">SYS//AR</text>
    <text x="824" y="0" class="arabic-text" text-anchor="end" direction="rtl" xml:lang="ar">مهندس نظم ومطور برمجيات متكاملة • أبني أنظمة محكمة غير قابلة للانهيار</text>
  </g>
</svg>