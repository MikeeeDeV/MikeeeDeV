<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="840" height="200" role="img" aria-label="Visitor Terminal Ledger">
  <title>Workstation Visitor Terminal Ledger</title>
  <desc>Living terminal ledger recording visitors and verified handshakes via GitHub Issues.</desc>
  <style>
    
    :root {
      --bg: #0A0E14;
      --card-bg: #111822;
      --card-elevated: #182230;
      --border: #223348;
      --border-accent: #3B5372;
      --text-primary: #E2E8F0;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --accent-gold: #E5C07B;
      --accent-lapis: #3898EC;
      --accent-teal: #2DD4BF;
      --accent-coral: #F43F5E;
      --term-green: #2DD4BF;
      --term-yellow: #E5C07B;
      --term-blue: #3898EC;
      --term-purple: #C678DD;
      --font-mono: ui-monospace, 'JetBrains Mono', 'SF Mono', 'Fira Code', 'Menlo', monospace;
      --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Cairo', sans-serif;
      --font-arabic: 'Cairo', 'Amiri', 'Noto Sans Arabic', 'Segoe UI', system-ui, sans-serif;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #F8FAFC;
        --card-bg: #FFFFFF;
        --card-elevated: #F1F5F9;
        --border: #CBD5E1;
        --border-accent: #94A3B8;
        --text-primary: #0F172A;
        --text-secondary: #475569;
        --text-muted: #64748B;
        --accent-gold: #B48924;
        --accent-lapis: #1E6BB8;
        --accent-teal: #0D9488;
        --accent-coral: #E11D48;
        --term-green: #0D9488;
        --term-yellow: #B48924;
        --term-blue: #1E6BB8;
        --term-purple: #9333EA;
      }
    }
    
    .ledger-card {
      fill: var(--card-bg);
      stroke: var(--border);
      stroke-width: 1px;
    }
    .ledger-header {
      fill: var(--card-elevated);
      stroke: var(--border);
      stroke-width: 1px;
    }
    .title-text {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.6px;
      fill: var(--accent-gold);
    }
    .hint-text {
      font-family: var(--font-mono);
      font-size: 10px;
      fill: var(--text-muted);
    }
  </style>

  <rect x="0.5" y="0.5" width="839" height="199" rx="8" class="ledger-card" />

  <!-- Top Title Bar -->
  <path d="M 0.5 8.5 A 8 8 0 0 1 8.5 0.5 L 831.5 0.5 A 8 8 0 0 1 839.5 8.5 L 839.5 32.5 L 0.5 32.5 Z" class="ledger-header" />
  
  <g transform="translate(18, 18)">
    <circle cx="0" cy="0" r="3.5" fill="var(--accent-teal)" />
    <text x="14" y="3.5" class="title-text">VISITOR TERMINAL LEDGER // INTERACTIVE HANDSHAKES</text>
    <text x="792" y="3.5" class="hint-text" text-anchor="end">TOTAL LOGS: 1 • OPEN ISSUE TO ENTER</text>
  </g>

  <!-- Table Rows -->
  
        <g transform="translate(24, 64)">
          <text x="0" y="0" font-family="var(--font-mono)" font-size="11" fill="var(--text-muted)">2026-10-19</text>
          <text x="85" y="0" font-family="var(--font-mono)" font-size="11" font-weight="700" fill="var(--accent-teal)">@MikeeeDeV</text>
          <text x="210" y="0" font-family="var(--font-mono)" font-size="11" font-weight="600" fill="var(--accent-gold)">❯ init</text>
          <text x="340" y="0" font-family="var(--font-mono)" font-size="11" fill="var(--text-secondary)">Initialized deterministic ledger. Welco...</text>
          <text x="780" y="0" font-family="var(--font-mono)" font-size="10" fill="var(--accent-lapis)" text-anchor="end">VERIFIED ✓</text>
        </g>
        

  <!-- Bottom Terminal Status Bar -->
  <line x1="20" y1="176" x2="820" y2="176" stroke="var(--border)" stroke-width="0.8" />
  <g transform="translate(24, 190)">
    <text x="0" y="0" font-family="var(--font-mono)" font-size="9" fill="var(--text-muted)">HASH CHAIN: SHA256//DETERMINISTIC_LEDGER</text>
    <text x="792" y="0" font-family="var(--font-mono)" font-size="9" fill="var(--accent-teal)" text-anchor="end">DISPATCHER: GH-ACTIONS / ZERO RUNTIME COST</text>
  </g>
</svg>