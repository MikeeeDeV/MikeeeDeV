<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="840" height="220" role="img" aria-label="Model Context Protocol (FastMCP) Tools Topology">
  <title>Model Context Protocol (FastMCP) Tool Topology</title>
  <desc>Standardized agent tools authored by Mohamed Ayman: nix_inspect_channel, git_smart_sync_audit, and session_guard_revoke_device.</desc>
  <style>
    
    :root {
      --bg: #0A0E14;
      --card-bg: #111822;
      --card-elevated: #182230;
      --border: #223348;
      --border-accent: #3B5372;
      --text-primary: #E2E8F0;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --accent-gold: #E5C07B;
      --accent-lapis: #3898EC;
      --accent-teal: #2DD4BF;
      --accent-coral: #F43F5E;
      --term-green: #2DD4BF;
      --term-yellow: #E5C07B;
      --term-blue: #3898EC;
      --term-purple: #C678DD;
      --font-mono: ui-monospace, 'JetBrains Mono', 'SF Mono', 'Fira Code', 'Menlo', monospace;
      --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Cairo', sans-serif;
      --font-arabic: 'Cairo', 'Amiri', 'Noto Sans Arabic', 'Segoe UI', system-ui, sans-serif;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #F8FAFC;
        --card-bg: #FFFFFF;
        --card-elevated: #F1F5F9;
        --border: #CBD5E1;
        --border-accent: #94A3B8;
        --text-primary: #0F172A;
        --text-secondary: #475569;
        --text-muted: #64748B;
        --accent-gold: #B48924;
        --accent-lapis: #1E6BB8;
        --accent-teal: #0D9488;
        --accent-coral: #E11D48;
        --term-green: #0D9488;
        --term-yellow: #B48924;
        --term-blue: #1E6BB8;
        --term-purple: #9333EA;
      }
    }
    
    .mcp-frame {
      fill: var(--card-bg);
      stroke: var(--border);
      stroke-width: 1px;
    }
    .mcp-header {
      fill: var(--card-elevated);
      stroke: var(--border);
      stroke-width: 1px;
    }
    .title-main {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      fill: var(--accent-gold);
    }
    .title-sub {
      font-family: var(--font-mono);
      font-size: 10px;
      fill: var(--accent-teal);
    }
    .footer-note {
      font-family: var(--font-mono);
      font-size: 9.5px;
      fill: var(--text-muted);
    }
  </style>

  <rect x="0.5" y="0.5" width="839" height="219" rx="8" class="mcp-frame" />

  <!-- Top Bar -->
  <path d="M 0.5 8.5 A 8 8 0 0 1 8.5 0.5 L 831.5 0.5 A 8 8 0 0 1 839.5 8.5 L 839.5 34.5 L 0.5 34.5 Z" class="mcp-header" />
  
  <g transform="translate(18, 20)">
    <circle cx="0" cy="0" r="3.5" fill="var(--accent-teal)" />
    <text x="14" y="3.5" class="title-main">MODEL CONTEXT PROTOCOL (FASTMCP) // AGENT RUNTIME SPEC</text>
    <text x="792" y="3.5" class="title-sub" text-anchor="end">TRANSPORT: STDIO / SSE • SPEC v1.0</text>
  </g>

  <!-- Tool Cards -->
  
        <g transform="translate(24, 66)">
          <rect x="0" y="0" width="250" height="114" rx="6" fill="var(--card-elevated)" stroke="var(--border)" stroke-width="1" />
          
          <text x="14" y="22" font-family="var(--font-mono)" font-size="12" font-weight="700" fill="var(--accent-teal)">nix_inspect_channel()</text>
          <text x="14" y="38" font-family="var(--font-mono)" font-size="10" fill="var(--text-muted)">repo: NixManagerPro</text>
          
          <text x="14" y="60" font-family="var(--font-sans)" font-size="11" fill="var(--text-secondary)">Inspects local and declarative Nix</text>
          <text x="14" y="76" font-family="var(--font-sans)" font-size="11" fill="var(--text-secondary)">channels, flake locks, and installed derivations...</text>
          
          <rect x="14" y="88" width="222" height="18" rx="3" fill="var(--card-bg)" stroke="var(--border-accent)" stroke-width="0.8" />
          <text x="125.0" y="100" text-anchor="middle" font-family="var(--font-mono)" font-size="9" font-weight="600" fill="var(--accent-gold)">read-only • deterministic</text>
        </g>
        
        <g transform="translate(294, 66)">
          <rect x="0" y="0" width="250" height="114" rx="6" fill="var(--card-elevated)" stroke="var(--border)" stroke-width="1" />
          
          <text x="14" y="22" font-family="var(--font-mono)" font-size="12" font-weight="700" fill="var(--accent-teal)">git_smart_sync_audit()</text>
          <text x="14" y="38" font-family="var(--font-mono)" font-size="10" fill="var(--text-muted)">repo: git-smart-sync</text>
          
          <text x="14" y="60" font-family="var(--font-sans)" font-size="11" fill="var(--text-secondary)">Audits local vs upstream branch to</text>
          <text x="14" y="76" font-family="var(--font-sans)" font-size="11" fill="var(--text-secondary)">divergence across multi-branch workflows prevent silent...</text>
          
          <rect x="14" y="88" width="222" height="18" rx="3" fill="var(--card-bg)" stroke="var(--border-accent)" stroke-width="0.8" />
          <text x="125.0" y="100" text-anchor="middle" font-family="var(--font-mono)" font-size="9" font-weight="600" fill="var(--accent-gold)">idempotent • zero-data-loss</text>
        </g>
        
        <g transform="translate(564, 66)">
          <rect x="0" y="0" width="250" height="114" rx="6" fill="var(--card-elevated)" stroke="var(--border)" stroke-width="1" />
          
          <text x="14" y="22" font-family="var(--font-mono)" font-size="12" font-weight="700" fill="var(--accent-teal)">session_guard_revoke_device()</text>
          <text x="14" y="38" font-family="var(--font-mono)" font-size="10" fill="var(--text-muted)">repo: next-session-guard</text>
          
          <text x="14" y="60" font-family="var(--font-sans)" font-size="11" fill="var(--text-secondary)">Immediately invalidates a device</text>
          <text x="14" y="76" font-family="var(--font-sans)" font-size="11" fill="var(--text-secondary)">compromised session across distributed Next.js clusters...</text>
          
          <rect x="14" y="88" width="222" height="18" rx="3" fill="var(--card-bg)" stroke="var(--border-accent)" stroke-width="0.8" />
          <text x="125.0" y="100" text-anchor="middle" font-family="var(--font-mono)" font-size="9" font-weight="600" fill="var(--accent-gold)">atomic • sub-5ms-propagation</text>
        </g>
        

  <!-- Footer Link -->
  <g transform="translate(24, 208)">
    <text x="0" y="0" class="footer-note">AGENT DISCOVERY ENDPOINT: <tspan fill="var(--accent-lapis)">raw.githubusercontent.com/MikeeeDeV/MikeeeDeV/main/mcp.json</tspan></text>
    <text x="792" y="0" class="footer-note" text-anchor="end">COMPATIBLE: Claude Desktop • Antigravity • Gemini CLI</text>
  </g>
</svg>